spring:
  datasource:
    url: {$DATABASE_URL}
    name: {$DATABASE_NAME}
    password: {$DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.postgresSQLDialect
  

  application:
    name: wbsbreak

server: 
  port: 8080
  
